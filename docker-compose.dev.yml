# Local demonstration, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# - Caddy serves plain HTTP on this computer only: http://localhost (or
#   http://localhost:<DEV_HTTP_PORT> when port 80 is taken, with
#   DEV_PUBLIC_URL set to match). No certificate, nothing published on 443.
# - The backend runs in development mode: without SMTP it starts anyway and
#   writes each e-mail (password reset links included) to its logs:
#     docker compose logs -f backend
# - The frontend is built for this address: switching between this file and
#   production means rebuilding it (--build).
# Never for real users.

services:
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    ports: !override
      - "127.0.0.1:${DEV_HTTP_PORT:-80}:80"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${DEV_PUBLIC_URL:-http://localhost}/api

  backend:
    environment:
      NODE_ENV: development
      APP_PUBLIC_URL: ${DEV_PUBLIC_URL:-http://localhost}
      FRONTEND_URL: ${DEV_PUBLIC_URL:-http://localhost}
      # Plain HTTP: cookies cannot be restricted to HTTPS here.
      COOKIE_SECURE: "false"
      ADMIN_COOKIE_SECURE: "false"

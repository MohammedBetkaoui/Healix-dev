# Continuous integration: the three components are built and tested in
# parallel, on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      # Only used as Prisma's shadow database: the migrations are replayed
      # there and compared with schema.prisma. The unit tests use no database.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: healixdz_shadow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials of the CI service, not a secret.
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/healixdz_ci
      SHADOW_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/healixdz_shadow
    steps:
      - uses: actions/checkout@v4

      # No "engines" field nor .nvmrc in the project: Node 22 LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Exit code 2 when the migrations do not produce schema.prisma: a model
      # was changed without its migration, or a migration was edited.
      - name: Schema and migrations agree
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      - run: npm run build

      # Chromium for the PDF report integration test (skipped without it).
      # The browser is cached; its system libraries are installed each time.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx jest --ci

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # The whole repository: a test compares the copied evaluation figures
      # with ai-service/evaluation/brain-latest.json.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx jest --ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - run: npx next build

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # PyTorch CPU wheels come from the PyTorch index, as in requirements.in.
      - run: >-
          python -m pip install
          -r requirements-dev.txt
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu

      # The weights are never in the repository: the tests that need them
      # are skipped (pointing AI_MODELS_DIR at an empty folder makes it
      # explicit), the others run against stand-in models.
      - run: python -m pytest
        env:
          AI_MODELS_DIR: ${{ runner.temp }}/no-model-weights

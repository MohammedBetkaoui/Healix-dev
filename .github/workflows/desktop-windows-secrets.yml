# Windows Credential Manager checks of the Desktop secret storage.
#
# The secret storage (desktop/src-tauri/src/security.rs) splits secrets longer
# than a Credential Manager entry into parts, publishes them with a manifest
# and removes the obsolete parts. Its logic is unit-tested everywhere by the
# standard CI (in-memory vault, including interrupted writes). This workflow
# runs the same behaviours against the REAL Windows Credential Manager of a
# GitHub Windows runner.
#
# Only synthetic secrets are used, under the service `dz.healix.desktop.test`
# and a random name, erased at the end of each test. A runner is not a clean
# user machine and cannot reboot: the reboot, the clean install and the
# upgrade stay manual (docs/windows-release-checklist.md).
#
# Kept outside the standard CI (the five jobs gating a release) until it has
# proven stable on the runners.

name: Desktop secrets (Windows Credential Manager)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/src-tauri/src/security.rs
      - .github/workflows/desktop-windows-secrets.yml
  push:
    branches: [main]
    paths:
      - desktop/src-tauri/src/security.rs
      - .github/workflows/desktop-windows-secrets.yml

permissions:
  contents: read

concurrency:
  group: desktop-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-manager:
    name: Credential Manager (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      # tauri::generate_context! needs the built front-end to compile.
      - name: Build the front-end (CI validation)
        env:
          VITE_IGNORE_MISSING_API_BASE: "1"
        run: npm run build

      - name: Secret storage unit tests (in-memory vault)
        working-directory: desktop/src-tauri
        run: cargo test --lib security

      - name: Real Windows Credential Manager (synthetic secrets only)
        working-directory: desktop/src-tauri
        env:
          HEALIX_REAL_KEYRING_TESTS: "1"
        run: cargo test --lib real_credential_manager -- --ignored --test-threads=1

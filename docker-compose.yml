# HealixDz: Caddy (HTTPS reverse proxy), frontend (Next.js), backend
# (NestJS + Chromium), MySQL, the AI service (FastAPI, PyTorch CPU), Orthanc
# (DICOM store) and the OHIF viewer. See DEPLOIEMENT.md.
#
# One public domain: https://<APP_DOMAIN>/api/* goes to the backend,
# /viewer/* to the DICOM viewer, everything else to the frontend. Caddy is the
# only container that publishes ports (80 and 443).
#
# Every setting and secret comes from .env, next to this file (copy
# .env.docker.example; .env is never versioned).
#
# Production by default: NODE_ENV=production, so the backend refuses to start
# without SMTP. Local demonstration over http://localhost, e-mails written to
# the backend logs:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

name: healixdz

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      viewer:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN manque dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manque dans .env}
      ADMIN_GATE_PATH: ${ADMIN_GATE_PATH:-/hzdz-control-gate-2026}
      # Back office from these addresses only; the default (everyone) leaves
      # the restriction off.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"
    volumes:
      # Caddyfile, Caddyfile.dev and the shared site configuration.
      - ./caddy:/etc/caddy:ro
      # Certificates and ACME account: keep them across restarts (Let's
      # Encrypt limits how often a certificate can be issued).
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # A fixed address, outside the range given to the other containers:
        # the backend trusts the X-Forwarded-For of this address only.
        ipv4_address: ${CADDY_IP:-172.30.0.10}
    healthcheck:
      # Caddy's admin endpoint, inside the container only.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Written into the JavaScript at build time: the browser calls the
        # API on the same origin. Rebuild the image after changing it.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://${APP_DOMAIN}/api}
        NEXT_PUBLIC_ADMIN_GATE_PATH: ${ADMIN_GATE_PATH:-/hzdz-control-gate-2026}
        # "true": shows the demo modules on mock data. Absent: hidden (404).
        NEXT_PUBLIC_ENABLE_DEMO_MODULES: ${ENABLE_DEMO_MODULES:-}
        # "true": offers the offline settlements next to the card payment (the
        # backend has the same switch). Absent: the card alone.
        NEXT_PUBLIC_MANUAL_PAYMENTS_ENABLED: ${MANUAL_PAYMENTS_ENABLED:-}
    image: healixdz-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Calls made by the Next.js server itself (session checks): straight to
      # the backend on the edge network, not through the public address.
      API_INTERNAL_URL: http://backend:3001/api
    # Edge network only: no route to MySQL nor to the AI service.
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The OHIF Viewer, built from its source (viewer/Dockerfile) to live under
  # /viewer/. Static files only: the page holds no data, the images come from
  # the authenticated DICOMweb proxy of the backend (/api/dicomweb). Edge
  # network only: no route to Orthanc, MySQL or the AI service.
  viewer:
    build: ./viewer
    image: healixdz-viewer:latest
    restart: unless-stopped
    volumes:
      # The configuration, read-only: a change needs a reload of the page, not
      # a rebuild.
      - type: bind
        source: ./viewer/app-config.js
        target: /usr/share/nginx/html/viewer/app-config.js
        read_only: true
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    image: healixdz-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      # allowPublicKeyRetrieval: MySQL 8 authentication (caching_sha2_password)
      # without TLS, on the internal network only.
      DATABASE_URL: mysql://${MYSQL_USER:-healixdz}:${MYSQL_PASSWORD:?MYSQL_PASSWORD manque dans .env}@mysql:3306/${MYSQL_DATABASE:-healixdz}?allowPublicKeyRetrieval=true
      FRONTEND_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      # One origin for pages and API: the browser never calls the API
      # cross-origin, so CORS stays off.
      CORS_ENABLED: "false"
      # Session cookies over HTTPS only (application: SameSite=Lax; back
      # office: Strict).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Only Caddy's X-Forwarded-For is believed: rate limits and the audit
      # log see the client's address, not Caddy's.
      TRUST_PROXY: ${TRUST_PROXY:-${CADDY_IP:-172.30.0.10}}
      # Requests per minute and per route: per signed-in user, per IP for the
      # others (see .env.docker.example).
      THROTTLE_USER_LIMIT: ${THROTTLE_USER_LIMIT:-600}
      THROTTLE_ANON_LIMIT: ${THROTTLE_ANON_LIMIT:-120}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      # Offline settlements (cash, postal transfer, BaridiMob receipt) are
      # off: the online card payment activates the subscription at once.
      MANUAL_PAYMENTS_ENABLED: ${MANUAL_PAYMENTS_ENABLED:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET manque dans .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET manque dans .env}
      OFFLINE_GRANT_PRIVATE_KEY: ${OFFLINE_GRANT_PRIVATE_KEY:?OFFLINE_GRANT_PRIVATE_KEY manque dans .env}
      OFFLINE_GRANT_PUBLIC_KEY: ${OFFLINE_GRANT_PUBLIC_KEY:?OFFLINE_GRANT_PUBLIC_KEY manque dans .env}
      OFFLINE_GRANT_LIFETIME_HOURS: ${OFFLINE_GRANT_LIFETIME_HOURS:-24}
      ADMIN_JWT_ACCESS_SECRET: ${ADMIN_JWT_ACCESS_SECRET:?ADMIN_JWT_ACCESS_SECRET manque dans .env}
      ADMIN_JWT_REFRESH_SECRET: ${ADMIN_JWT_REFRESH_SECRET:?ADMIN_JWT_REFRESH_SECRET manque dans .env}
      ADMIN_GATE_PATH: ${ADMIN_GATE_PATH:-/hzdz-control-gate-2026}
      # Encryption of the message bodies; the backend refuses to start
      # without it.
      MESSAGING_KEYS: ${MESSAGING_KEYS:?MESSAGING_KEYS manque dans .env}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN manque dans .env}
      AI_EVALUATION_REPORT_PATH: /app/evaluation/brain-latest.json
      # The pathology reports: the one of the analysis's own weights is used.
      AI_PATHOLOGY_EVALUATION_DIR: /app/evaluation
      # Cardiology: the service's evaluation, else the notebook's figures of
      # the model card (next to the weights), for the analysis's weights only.
      AI_CARDIO_EVALUATION_PATH: /app/evaluation/cardio-latest.json
      AI_CARDIO_MODEL_CARD_PATH: /app/model-cards/cardio-ecg-resnet1d-ptbxl.json
      AI_CARDIO_SEG_EVALUATION_PATH: /app/evaluation/cardio-seg-latest.json
      AI_CARDIO_SEG_MODEL_CARD_PATH: /app/model-cards/cardio-seg-acdc-unet-effb4.json
      AI_CARDIO_VOLUME_EVALUATION_PATH: /app/evaluation/cardio-volume-latest.json
      UPLOAD_ROOT: /app/uploads
      # The DICOM store, on the internal network. In production the backend
      # refuses to start when the password is shorter than 24 characters.
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:?ORTHANC_USERNAME manque dans .env}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD manque dans .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Patient documents, segmentation masks and PDF reports.
      - patient-files:/app/uploads
      # The evaluation reports (brain-latest.json, pathology-*.json,
      # cardio*.json) quoted
      # in the PDF reports, read-only.
      - type: bind
        source: ./ai-service/evaluation
        target: /app/evaluation
        read_only: true
      # The models folder, for the cardiology model cards (their test figures),
      # read-only.
      - type: bind
        source: ${AI_MODELS_DIR:-./models}
        target: /app/model-cards
        read_only: true
    # Edge: reached by Caddy and the frontend, and its way out (SMTP).
    # Internal: MySQL, the AI service and Orthanc. No published port.
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations run before the API starts.
      start_period: 120s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healixdz}
      MYSQL_USER: ${MYSQL_USER:-healixdz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manque dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manque dans .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # Internal network only, no published port: reachable from the backend.
    networks:
      - internal
    healthcheck:
      # Over TCP: the temporary server of the first start-up (no network)
      # does not count as ready.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ai-service:
    build: ./ai-service
    image: healixdz-ai-service:latest
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN manque dans .env}
      AI_MODELS_DIR: /models
    volumes:
      # The weights stay on the host, read-only; never in the image.
      - type: bind
        source: ${AI_MODELS_DIR:-./models}
        target: /models
        read_only: true
    # Internal network only, no published port, no Internet access: it only
    # ever receives image or ECG signal bytes from the backend.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The DICOM store: the studies imported into the patient records, and the
  # DICOMweb API the viewer reads through the backend's authenticated proxy.
  # Internal network only, no published port. The DICOM server (port 4242) is
  # off, so a study enters by the backend's import route alone; the web
  # interfaces of Orthanc are off too. Every setting below is an environment
  # variable of the image (https://orthanc.uclouvain.be/book/users/docker-orthancteam.html):
  # ORTHANC__ + the name of the option in upper snake case, "__" between two
  # levels; *_PLUGIN_ENABLED switches a plugin.
  orthanc:
    image: orthancteam/orthanc:26.9.1
    restart: unless-stopped
    # "orthanc" (uid 999) of the image, which owns /var/lib/orthanc: by
    # number, for runAsNonRoot checks.
    user: "999:999"
    environment:
      # HTTP authentication: the backend's account only. Letters and digits
      # (the pair is written in a JSON object).
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:?ORTHANC_USERNAME manque dans .env}": "${ORTHANC_PASSWORD:?ORTHANC_PASSWORD manque dans .env}"}'
      # Nothing listens but the HTTP API: no DICOM port, no web interface
      # (Orthanc Explorer 1 and 2), no WebDAV.
      ORTHANC__DICOM_SERVER_ENABLED: "false"
      ORTHANC__ORTHANC_EXPLORER_ENABLED: "false"
      ORTHANC__WEB_DAV_ENABLED: "false"
      ORTHANC_EXPLORER_2_ENABLED: "false"
      # The index (SQLite) and the DICOM files in two folders of one volume:
      # the backup archives the index first (see DEPLOIEMENT.md, section 8).
      ORTHANC__INDEX_DIRECTORY: /var/lib/orthanc/index
      ORTHANC__STORAGE_DIRECTORY: /var/lib/orthanc/storage
      # DICOMweb, read through the backend at /api/dicomweb/ (the base path of
      # the URLs Orthanc writes into its answers). The host of those URLs is
      # the one the backend calls; the viewer rewrites it (viewer/app-config.js).
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__PUBLIC_ROOT: /api/dicomweb/
      ORTHANC__DICOM_WEB__ALLOWED_HOSTS: '["orthanc", "orthanc:8042"]'
    volumes:
      - orthanc-data:/var/lib/orthanc
    networks:
      - internal
    healthcheck:
      # The probe of the image: calls /changes from inside, with the account
      # of the configuration.
      test: ["CMD", "python3", "/probes/test-aliveness.py"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # Nightly backup at BACKUP_TIME: the database (mysqldump --single-transaction,
  # gzip), the patient files and the Orthanc volume (tar.gz), timestamped, each
  # with its SHA-256, in BACKUP_DIR on the host; kept BACKUP_RETENTION_DAYS
  # days; encrypted with age when BACKUP_AGE_RECIPIENT is set. One backup now:
  #   docker compose exec backup healixdz-backup
  backup:
    build: ./scripts/backup
    image: healixdz-backup:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment: &backup-environment
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healixdz}
      MYSQL_USER: ${MYSQL_USER:-healixdz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manque dans .env}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${BACKUP_TZ:-Africa/Algiers}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - patient-files:/data/patient-files:ro
      - orthanc-data:/data/orthanc:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # The MySQL image declares a data volume this container never uses.
    tmpfs:
      - /var/lib/mysql
    networks:
      - internal

  # One-off restore of a backup (database, patient files, Orthanc volume), into
  # an empty stack: see DEPLOIEMENT.md.
  #   docker compose --profile restore run --rm restore <db archive> <files archive> <orthanc archive>
  restore:
    image: healixdz-backup:latest
    profiles:
      - restore
    # The two volumes belong to different users (uid 1000 for the patient
    # files, uid 999 for Orthanc): as root, tar gives each file back the owner
    # recorded in the archive. Nothing else runs in this container.
    user: "0:0"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *backup-environment
      # Private age key, mounted at run time for encrypted backups only.
      BACKUP_AGE_IDENTITY_FILE: /run/age/identity
    volumes:
      - patient-files:/data/patient-files
      - orthanc-data:/data/orthanc
      - ${BACKUP_DIR:-./backups}:/backups:ro
    tmpfs:
      - /var/lib/mysql
    networks:
      - internal
    entrypoint: ["healixdz-restore"]
    command: []

  # One-off: creates (or updates) the first administrator and the
  # subscription plans with the existing seed (prisma/seed.ts).
  #   docker compose --profile seed run --rm admin-seed
  admin-seed:
    image: healixdz-backend:latest
    profiles:
      - seed
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-healixdz}:${MYSQL_PASSWORD:?MYSQL_PASSWORD manque dans .env}@mysql:3306/${MYSQL_DATABASE:-healixdz}?allowPublicKeyRetrieval=true
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      # Checked by the seed itself, which stops when one is missing.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_FULL_NAME: ${ADMIN_SEED_FULL_NAME:-}
      ADMIN_SEED_PHONE: ${ADMIN_SEED_PHONE:-admin-healixdz}
      ADMIN_SEED_UPDATE_PASSWORD: ${ADMIN_SEED_UPDATE_PASSWORD:-false}
    networks:
      - internal
    command: ["node", "dist/prisma/seed.js"]

volumes:
  mysql-data:
  patient-files:
  orthanc-data:
  caddy-data:
  caddy-config:

networks:
  # Caddy, frontend and backend. Fixed subnet so that Caddy's address is
  # known (CADDY_IP); the other containers get addresses from ip_range only.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
          ip_range: ${EDGE_IP_RANGE:-172.30.0.128/25}
  # Backend, MySQL, the AI service and Orthanc. No route to the outside.
  internal:
    internal: true

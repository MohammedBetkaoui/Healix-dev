[package]
name = "healixdz-desktop"
version = "0.1.0"
description = "HealixDz offline-first clinical desktop"
authors = ["HealixDz"]
edition = "2021"
default-run = "healixdz-desktop"

[lib]
name = "healixdz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Offline reliability harness (docs/offline-reliability-testing.md): the real
# sync engine driven from a command line, with its secrets in a folder instead
# of the OS vault and crash points. Never enabled in a shipped build.
[features]
e2e-harness = ["tokio/rt"]

[[bin]]
name = "healixdz-desktop"
path = "src/main.rs"

[[bin]]
name = "offline-e2e-harness"
path = "src/bin/offline_e2e_harness.rs"
required-features = ["e2e-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

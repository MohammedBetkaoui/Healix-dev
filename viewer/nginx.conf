# The OHIF Viewer's files, served under /viewer/ only. Caddy sits in front of
# it (HTTPS, security headers, Content-Security-Policy): nothing of that is
# repeated here. The page holds no data; the images come from the
# authenticated proxy of the backend.
server {
  # nginx-unprivileged runs as a normal user: a port above 1024.
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  absolute_redirect off;

  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json
             application/wasm image/svg+xml;

  # For the container's health check only.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /viewer {
    return 301 /viewer/$is_args$args;
  }

  # The page, the configuration and the boot scripts are never kept: a change
  # of the configuration or of the build is seen at the next load. The other
  # files have a name made of their content.
  location ~ ^/viewer/(index\.html|app-config\.js|init-service-worker\.js|inline-\d+\.js)$ {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Resource-Policy same-origin;
  }

  # The viewer is a single-page application: its routes (/viewer/viewer?...)
  # are the page.
  location /viewer/ {
    try_files $uri $uri/ /viewer/index.html;
    add_header Cross-Origin-Resource-Policy same-origin;
  }

  location / {
    return 404;
  }
}
